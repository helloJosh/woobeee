# docker compose 에서 SPRING_PROFILES_ACTIVE=prod-docker 로 켜는 프로파일.
# application.yaml 위에 "덮어쓸 것만" 적는다.
#
# 컨테이너 안에서 localhost 는 자기 자신이다. 그래서 같은 compose 네트워크의 서비스 이름과
# "컨테이너 내부 포트"(호스트 포트 9432/9379 가 아니라 5432/6379)로 붙는다.
# 값마다 ${ENV:기본값} 형태라 docker run -e / compose environment 로 다시 덮어쓸 수 있다.
#
# 주의: 이 파일은 jar 안에 들어가 이미지에 남는다. 여기 적힌 값은 로컬 compose 용 개발 자격증명이다.
# 실제 운영 비밀번호는 적지 말고 환경변수로만 주입한다. GOOGLE_CLIENT_SECRET 도 여기 두지 않는다.

spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://postgres-management:5432/market}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:123456789}
  kafka:
    # 같은 compose 네트워크의 PLAINTEXT 리스너. SASL 리스너(8010/8011)는 호스트에서 붙는 용도다.
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:woobeee-kafka:29092}
  data:
    redis:
      host: ${REDIS_HOST:redis}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:root!23}

storage:
  s3:
    # 서버 -> MinIO 는 내부 주소, 브라우저 -> MinIO(presigned URL)는 호스트에서 보이는 주소다.
    endpoint: ${S3_ENDPOINT:http://minio:9000}
    public-endpoint: ${S3_PUBLIC_ENDPOINT:http://localhost:9000}
    region: ${S3_REGION:ap-northeast-2}
    bucket: ${S3_BUCKET:woobeee}
    access-key: ${S3_ACCESS_KEY:admin}
    secret-key: ${S3_SECRET_KEY:admin!23}
