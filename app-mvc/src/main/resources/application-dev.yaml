# 개발 프로파일 — 로컬에서 손으로 띄울 때.
#
#   ./mvnw -pl app-mvc spring-boot:run -Dspring-boot.run.profiles=dev
#   java -jar app-mvc/target/app-mvc.jar --spring.profiles.active=dev
#
# 기본(application.yaml)은 배포 기준이다. 여기서는 개발에 필요한 만큼만 덮어쓴다 —
# DB·Redis·S3 주소는 기본값이 이미 로컬 compose 를 가리키므로 다시 적지 않는다.
#
# 주의: 이 프로파일은 **공유 개발 DB(market)** 를 쓴다. 실제 회원·글·일정·신청서가 들어 있고
# 백업이 없다. 데이터를 지우는 검증이 필요하면 test 프로파일(market_test)로 띄운다.
spring:
  jpa:
    # 쿼리를 눈으로 따라가려고 켠다. 배포에서는 로그가 감당이 안 되므로 꺼 둔다.
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        use_sql_comments: true
        highlight_sql: true

logging:
  level:
    # 바인딩되는 파라미터까지 본다 — 배포에서는 값이 그대로 로그에 남으므로 켜지 않는다.
    org.hibernate.orm.jdbc.bind: trace
    org.springframework.transaction.interceptor: trace
    com.woobeee.mvc: debug
