server:
  shutdown: graceful
  port: 8000
  ssl:
    enabled: false

oauth:
  google:
    client-id: 985212099499-uel8drlne8o4et7e3u1gbnjjvdi0k11l.apps.googleusercontent.com
    client-secret: ${GOOGLE_CLIENT_SECRET:change-me}
    redirect-uri: ${GOOGLE_REDIRECT_URI:http://localhost:3000/auth/google/callback}
    authorization-uri: https://accounts.google.com/o/oauth2/v2/auth
    token-uri: https://oauth2.googleapis.com/token
    scope: openid email profile
    authorization-state-ttl-seconds: 600
    connect-timeout-seconds: 5
    read-timeout-seconds: 10

storage:
  s3:
    # 서버 -> MinIO. 브라우저는 이 값을 보지 않는다.
    endpoint: ${S3_ENDPOINT:http://localhost:9000}
    # 브라우저 -> MinIO. presigned URL 의 host 가 여기서 나오므로 외부에서 닿아야 한다.
    # 프로덕션은 S3_PUBLIC_ENDPOINT=https://image.woobeee.com (터널이 :9000 으로 넘긴다).
    public-endpoint: ${S3_PUBLIC_ENDPOINT:http://localhost:9000}
    region: ${S3_REGION:ap-northeast-2}
    bucket: ${S3_BUCKET:woobeee}
    access-key: ${S3_ACCESS_KEY:admin}
    secret-key: ${S3_SECRET_KEY:admin!23}
    # 글 본문 이미지 presigned URL 의 유효기간 = 1일.
    # 서명 한도는 7일(SigV4)이므로 그 안이다. 글 이미지는 공개 게시물의 일부라 URL 이
    # 새어도 잃는 것이 없고, 길게 잡으면 탭을 오래 열어 둔 방문자가 깨진 이미지를 보지 않는다.
    presigned-url-expiration-seconds: 86400
    path-style-access-enabled: true

pokemon:
  # 신청자가 이체할 계좌. 화면에 그대로 찍히는 문자열이고, 공동구매 페이지가 공개이므로
  # 이 값도 공개로 노출된다. 실제 계좌번호는 레포에 두지 않고 POKEMON_BANK_ACCOUNT 로 넣는다
  # — 미설정이면 아래 문구가 그대로 화면에 뜨므로 빠뜨리면 바로 눈에 띈다.
  bank-account: ${POKEMON_BANK_ACCOUNT:계좌 정보가 아직 설정되지 않았습니다}
  # 진행 상태를 바꿀 수 있는 회원 id. 블로그의 ROLE_ADMIN 과 별개다 — 이 공동구매를 실제로
  # 굴리는 사람만 손대야 하므로 역할이 아니라 명단으로 좁혔다.
  manager-member-ids: ${POKEMON_MANAGER_MEMBER_IDS:1,3}
  app-store:
    # 상품표를 긁어 올 제품 페이지. robots.txt 가 /in/app/... 를 막지 않는다(사이트맵에 있다).
    url: ${POKEMON_APP_STORE_URL:https://apps.apple.com/in/app/pok%C3%A9mon-go/id1094591345}
    # 매일 06:00 (Asia/Seoul). 신청이 몰리기 전에 하루치 가격을 맞춰 둔다.
    sync-cron: ${POKEMON_APP_STORE_SYNC_CRON:0 0 6 * * *}
  exchange-rate:
    # 키 없이 쓰는 대신 하루 한 번만 갱신된다. 초 단위 실시간이 아니라는 뜻이고,
    # 어차피 실제 청구액은 카드사 환율 + 해외결제 수수료가 붙어 달라진다.
    url: ${POKEMON_RATE_URL:https://open.er-api.com/v6/latest/INR}
    # 제공자가 하루 한 번 갱신하므로 이보다 짧게 잡을 이유가 없다.
    cache-ttl: ${POKEMON_RATE_CACHE_TTL:1h}

spring:
  application:
    name: woobeee-app-mvc
  servlet:
    multipart:
      # 게시글 첨부 업로드 — 기본값(파일당 1MB)은 사진 한 장도 못 받는다.
      # 쓰기는 ROLE_ADMIN 전용이라 남용 면이 좁아 넉넉하게 잡았다.
      max-file-size: 500MB
      max-request-size: 1GB
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:9379}
      password: ${REDIS_PASSWORD:root!23}
  jpa:
    open-in-view: false
    show-sql: true
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
        use_sql_comments: true
        highlight_sql: true
        auto_quote_keyword: true
        hbm2ddl:
          auto: validate

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:9432/market}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:123456789}
    driver-class-name: org.postgresql.Driver
    type: org.apache.commons.dbcp2.BasicDataSource
    dbcp2:
      initial-size: 5
      max-total: 30
      max-idle: 15
      min-idle: 5
      max-wait-millis: 10000
      validation-query: SELECT 1
      test-on-borrow: true
      test-while-idle: true
      time-between-eviction-runs-millis: 5000
      min-evictable-idle-time-millis: 60000

logging:
  level:
    org.hibernate.orm.jdbc.bind: trace
    org.springframework.transaction.interceptor: trace
  file:
    name: logs/app-mvc.log
