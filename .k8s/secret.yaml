# docker-compose.yml 과 같은 "로컬 개발용" 자격증명이다. 실제 운영 값을 커밋하지 않는다.
# 운영 비밀은 이 파일을 덮어쓰지 말고 클러스터에서 직접 만든다:
#   kubectl -n woobeee create secret generic woobeee-secrets --from-literal=... --dry-run=client -o yaml | kubectl apply -f -
apiVersion: v1
kind: Secret
metadata:
  name: woobeee-secrets
  namespace: woobeee
type: Opaque
stringData:
  POSTGRES_PASSWORD: "123456789"
  REDIS_PASSWORD: "root!23"
  MINIO_ROOT_USER: "admin"
  MINIO_ROOT_PASSWORD: "admin!23"
  # 비밀값이라 기본은 자리표시자다. k8s-up.sh 가 셸의 GOOGLE_CLIENT_SECRET 로 덮는다.
  GOOGLE_CLIENT_SECRET: "change-me"
