apiVersion: v1
kind: Service
metadata:
  name: front
  namespace: woobeee
spec:
  selector: { app: front }
  ports:
    - port: 3000
      targetPort: 3000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: front
  namespace: woobeee
spec:
  replicas: 1
  selector:
    matchLabels: { app: front }
  template:
    metadata:
      labels: { app: front }
    spec:
      enableServiceLinks: false
      containers:
        - name: front
          # MVC_ORIGIN(http://app-mvc:8000)·NEXT_PUBLIC_GOOGLE_CLIENT_ID 는 빌드 인자라 이미지에 굳어 있다.
          # k8s 에서도 서비스 이름이 app-mvc 라 compose 로 빌드한 이미지를 그대로 쓴다.
          image: woobeee/front:latest
          imagePullPolicy: IfNotPresent
          env:
            # 서버 컴포넌트(lib/server-blog.ts)가 런타임에 읽는다. 빌드 인자 MVC_ORIGIN 과는 별개다.
            - { name: MVC_ORIGIN, value: "http://app-mvc:8000" }
          ports:
            - containerPort: 3000
          readinessProbe:
            tcpSocket: { port: 3000 }
            periodSeconds: 5
