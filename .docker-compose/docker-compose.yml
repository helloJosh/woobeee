services:
  postgres-management:
    image: postgres:18
    container_name: woobeee-db
    restart: always
    ports:
      - 9432:5432
    environment:
      POSTGRES_USER: root
      POSTGRES_PASSWORD: 123456789
      POSTGRES_DB: market
      TZ: Asia/Seoul
    volumes:
      - .docker-volumes/postgres/market:/var/lib/postgresql
    # app-mvc 가 DB 가 준비된 뒤에 뜨도록 depends_on(service_healthy)이 이 결과를 본다.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U root -d market"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:latest
    container_name: woobeee-redis
    restart: always
    ports:
      - 9379:6379
    volumes:
      - .docker-volumes/redis/data:/data
    command: [ "redis-server", "--appendonly", "yes", "--requirepass", "root!23" ]

  # 로컬 인프라로만 제공한다. 현재 어떤 앱도 Kafka에 연동하지 않는다(ADR-003 참고).
  kafka:
    image: confluentinc/cp-kafka:latest
    container_name: woobeee-kafka
    restart: unless-stopped
    ports:
      - "8010:8010"
      - "8011:8011"
    environment:
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
      KAFKA_KRAFT_MODE: "true"
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: "broker,controller"
      KAFKA_LISTENERS: "PLAINTEXT://woobeee-kafka:29092,SASL_PLAINTEXT://0.0.0.0:8010,SASL_PLAINTEXT_LOCALHOST://0.0.0.0:8011,CONTROLLER://woobeee-kafka:9093"
      # 원본(art-market-place)은 SASL_PLAINTEXT advertised host 에 공개 IP 를 박아두어
      # 로컬에서는 8010 리스너로 접속할 수 없었다. localhost 로 교정했다.
      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://woobeee-kafka:29092,SASL_PLAINTEXT://localhost:8010,SASL_PLAINTEXT_LOCALHOST://localhost:8011"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,SASL_PLAINTEXT:SASL_PLAINTEXT,SASL_PLAINTEXT_LOCALHOST:SASL_PLAINTEXT"
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@woobeee-kafka:9093"
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      KAFKA_INTER_BROKER_LISTENER_NAME: "PLAINTEXT"
      KAFKA_SASL_ENABLED_MECHANISMS: "PLAIN"
      KAFKA_SASL_MECHANISM_INTER_BROKER_PROTOCOL: "PLAIN"

      # KRaft 모드에서 AclAuthorizer 대신 StandardAuthorizer 사용
      KAFKA_AUTHORIZER_CLASS_NAME: "org.apache.kafka.metadata.authorizer.StandardAuthorizer"
      KAFKA_ALLOW_EVERYONE_IF_NO_ACL_FOUND: "true"
      KAFKA_SUPER_USERS: "User:admin"
      KAFKA_LOG_DIRS: "/tmp/kraft-combined-logs"
      KAFKA_LISTENER_NAME_SASL_PLAINTEXT_PLAIN_SASL_JAAS_CONFIG: "org.apache.kafka.common.security.plain.PlainLoginModule required username=\"admin\" password=\"admin!23\" user_admin=\"admin!23\";"
      KAFKA_OPTS: "-Djava.security.auth.login.config=/etc/kafka/kafka_server_jaas.conf"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_DEFAULT_REPLICATION_FACTOR: 1
    volumes:
      - ./config/kafka_server_jaas.conf:/etc/kafka/kafka_server_jaas.conf
      - .docker-volumes/kafka:/tmp/kraft-combined-logs

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: woobeee-kafka-ui
    restart: unless-stopped
    ports:
      - "8090:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: kraft-cluster
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: woobeee-kafka:29092
      KAFKA_CLUSTERS_0_PROPERTIES_SECURITY_PROTOCOL: PLAINTEXT

      AUTH_TYPE: "LOGIN_FORM"
      SPRING_SECURITY_USER_NAME: admin
      SPRING_SECURITY_USER_PASSWORD: admin!23
      SERVER_SERVLET_CONTEXT_PATH: "/kafka-ui"
    depends_on:
      - kafka

  minio:
    image: minio/minio:latest
    container_name: woobeee-minio
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - .docker-volumes/minio:/data
    environment:
      MINIO_ROOT_USER: admin
      MINIO_ROOT_PASSWORD: admin!23
    command: server /data --console-address ":9001"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  # 버킷은 비공개다. 예전에는 여기서 `mc anonymous set public` 을 걸었는데, 그것은 이 버킷
  # 전체에 익명 읽기 **와 쓰기** 를 여는 것이었다.
  #
  # 버킷은 presigned URL 로만 닿는다 — 프로필 이미지는 MemberProfileImageService
  # (presignPutObject / presignGetObject). 익명 정책에 기대는 경로는 코드에 없다.
  #
  # `set none` 을 명시적으로 부르는 이유: 예전 compose 로 이미 버킷을 만든 개발자의 MinIO
  # 볼륨에는 공개 정책이 그대로 남아 있다. 줄을 지우기만 하면 그 환경은 계속 공개다.
  createbuckets:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      until mc alias set myminio http://minio:9000 admin admin!23; do
        echo 'waiting for minio...';
        sleep 3;
      done;
      mc mb myminio/woobeee || true;
      mc anonymous set none myminio/woobeee || true
      "

  # ---------------------------------------------------------------------
  # 애플리케이션 이미지. 위는 인프라, 아래는 우리가 빌드하는 앱이다.
  #   docker compose -f .docker-compose/docker-compose.yml up -d --build app-mvc front
  # 인프라만 쓰고 앱은 IDE 에서 돌리는 기존 방식도 그대로 된다(앱 서비스를 지정하지 않으면 된다).
  # ---------------------------------------------------------------------

  # auth + blog (Spring MVC). 빌드 컨텍스트는 레포 루트(core 모듈이 필요하다) — Dockerfile 주석 참고.
  app-mvc:
    build:
      context: ..
      dockerfile: app-mvc/Dockerfile
    image: woobeee/app-mvc:latest
    container_name: woobeee-app-mvc
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      # DB/Redis/MinIO 접속 설정은 application-prod-docker.yml 에 있다(컨테이너 내부 주소 기준).
      SPRING_PROFILES_ACTIVE: prod-docker
      # 비밀값이라 파일에 적지 않는다. 실행하는 셸의 환경변수에서 가져온다(없으면 application.yaml 기본값).
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-change-me}
      # 운영에서는 셸 환경변수로 덮는다(.docker-compose/docker-up.sh). 없으면 로컬 기본값.
      GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI:-http://localhost:3000/auth/google/callback}
      S3_PUBLIC_ENDPOINT: ${S3_PUBLIC_ENDPOINT:-http://localhost:9000}
    depends_on:
      postgres-management:
        condition: service_healthy
      redis:
        condition: service_started
      minio:
        condition: service_healthy

  # Next.js. 아래 args 는 "빌드 시점"에 이미지에 굳는다(front/Dockerfile 주석 참고).
  # 값을 바꾸면 --build 로 다시 빌드해야 반영된다.
  front:
    build:
      context: ../front
      args:
        # Next 서버(컨테이너)가 백엔드를 프록시하는 주소 — 컨테이너 간 통신이라 서비스 이름을 쓴다.
        MVC_ORIGIN: http://app-mvc:8000
        NEXT_PUBLIC_GOOGLE_CLIENT_ID: ${NEXT_PUBLIC_GOOGLE_CLIENT_ID:-985212099499-uel8drlne8o4et7e3u1gbnjjvdi0k11l.apps.googleusercontent.com}
    image: woobeee/front:latest
    container_name: woobeee-front
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      - app-mvc
